name: Core validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: kd_pipeline/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run unit tests
        run: python -m pytest kd_pipeline/tests -q

      - name: Check Python and shell syntax
        run: |
          python -m py_compile \
            cot_quality.py \
            convert_cot_to_all.py \
            gen_all.py \
            gen_cot_data.py \
            gen_teacher_data.py \
            evaluation/lmms_eval/utils.py
          bash -n scripts/run_teacher_generation.slurm
